spring.application.name=einvoice-api
server.port=8081

spring.threads.virtual.enabled=true

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/ota_einvoicing_monitor
spring.datasource.username=ota
spring.datasource.password=ota_pass

app.security.admin-secret-key=dev-flask-secret-change-me

#JWT configurations
jwt.secret=e3a65ecd5ea5eaec6e83354aaeecebb5e55eeab6c3354aaeeceb3354aaeeceb1
jwt.expiration=86400000

# debug configurations
logging.level.org.springframework.security=DEBUG
logging.level.root=WARN
logging.level.com.fasterxml.jackson.databind=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.http.converter.json=DEBUG
logging.level.com.fasterxml.jackson=DEBUG
logging.level.com.aibizs.einvoice=DEBUG

logging.level.org.springframework.http.converter=TRACE

# Redis connection
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=aibizzPazz

# max wait for a Redis command to answer
spring.data.redis.timeout=2s

# max wait to open a connection
spring.data.redis.connect-timeout=2s

# Idempotency
# false = skip the check (handy in dev)
app.idempotency.enabled=true
# prefix for keys in Redis
app.idempotency.key-prefix=idem:
# how long a request may be "being processed"
app.idempotency.in-progress-ttl=60s

# how long a finished request is remembered
app.idempotency.result-ttl=24h


#application legacy api key deprecated
app.api-key=change-me-in-production


einvoice.ubl.service=http://localhost:8082
einvoice.ubl.service.convert.ubl=/api/v1/ubl/xml/{docType}

einvoice.validation.service=http://localhost:8083
einvoice.validation.service.validate.xml=/api/v1/validate

einvoice.peppol-ap.service=http://localhost:8084
einvoice.peppol-ap.service.validate.xml=/api/v1/wrap

einvoice.oxalis-connector.service=http://localhost:8085
einvoice.oxalis-connector.service.send=/api/v1/oxalis/lookup

einvoice.fs.oxalis.home=/home/ubuntu/oxalis
